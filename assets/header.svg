<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/><stop offset="0.5" stop-color="#203A43"/><stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00D4FF"/><stop offset="1" stop-color="#8E7BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.35"/><stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <style>
      text{font-family:'Fira Code','JetBrains Mono',Consolas,Menlo,monospace}
      .float{animation:float 6s ease-in-out infinite}
      .float2{animation:float 8s ease-in-out infinite reverse}
      .float3{animation:float 7s ease-in-out 1s infinite}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .in1{opacity:0;animation:fadeUp 1s ease-out .2s forwards}
      .in2{opacity:0;animation:fadeUp 1s ease-out .7s forwards}
      .in3{opacity:0;animation:fadeUp 1s ease-out 1.1s forwards}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
      @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <circle class="pulse" cx="500" cy="130" r="230" fill="url(#glow)"/>
  <!-- decorative grid dots -->
  <g fill="#ffffff" opacity="0.07">
    <circle cx="60" cy="40" r="2"/><circle cx="100" cy="40" r="2"/><circle cx="140" cy="40" r="2"/>
    <circle cx="60" cy="80" r="2"/><circle cx="100" cy="80" r="2"/><circle cx="140" cy="80" r="2"/>
    <circle cx="860" cy="200" r="2"/><circle cx="900" cy="200" r="2"/><circle cx="940" cy="200" r="2"/>
    <circle cx="860" cy="220" r="2"/><circle cx="900" cy="220" r="2"/><circle cx="940" cy="220" r="2"/>
  </g>
  <!-- rotating rings -->
  <g class="spin" opacity="0.25">
    <circle cx="880" cy="70" r="46" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="6 8"/>
  </g>
  <g class="spin" opacity="0.2" style="animation-direction:reverse">
    <circle cx="110" cy="200" r="38" fill="none" stroke="#8E7BFF" stroke-width="1.5" stroke-dasharray="4 7"/>
  </g>
  <!-- floating code symbols -->
  <g fill="#00D4FF" font-size="34" font-weight="700">
    <text class="float"  x="90"  y="70"  opacity="0.55">&lt;/&gt;</text>
    <text class="float2" x="800" y="90"  opacity="0.45" fill="#8E7BFF">{ }</text>
    <text class="float3" x="170" y="205" opacity="0.40" fill="#8E7BFF">( )</text>
    <text class="float"  x="840" y="205" opacity="0.50">=&gt;</text>
    <text class="float2" x="300" y="55"  opacity="0.30" font-size="24">;</text>
    <text class="float3" x="700" y="48"  opacity="0.30" font-size="24">#</text>
  </g>
  <!-- title -->
  <text class="in1" x="500" y="125" text-anchor="middle" font-size="58" font-weight="800" fill="url(#txt)">Elang Argawana</text>
  <text class="in2" x="500" y="168" text-anchor="middle" font-size="22" fill="#E6F6FF">Frontend &amp; Fullstack Developer</text>
  <g class="in3">
    <text x="500" y="203" text-anchor="middle" font-size="15" fill="#8FB8C9">Semarang, Central Java</text>
  </g>
</svg>